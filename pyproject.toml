[project]
name = "velcro"
version = "0.2.0"
description = "GPU-native continuum gyrokinetic turbulence code (JAX)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Nico Rodriguez" }]
dependencies = [
    "jax>=0.4.30",
    "equinox>=0.11",
    "pydantic>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist", "matplotlib"]
gvec = ["gvec"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["velcro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "fast: finishes in seconds on a CPU (marked by measured duration in tests/fast_tests.json)",
    "slow: full L=48 end-to-end run (~1 min); needs --runslow",
]
