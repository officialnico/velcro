schema_version = 1

# GKX's kinetic-electron Cyclone example (examples/05_kinetic_electrons/case.toml of GKX 2.8.1, MIT License,
# Copyright (c) 2025 UW Plasma) with collisions and delta-B_par added: conserving Dougherty collisions
# (collision_operator = "lenard_bernstein"; nu_ii 0.01, nu_ee 0.6086 v_ti/a, like-species only), A_par and delta-B_par
# at beta 1e-3. 64 x 64 x 24, (Nl, Nm) = (4, 16), imex-ars3 at fixed dt 0.035, to t = 400 a/v_ti. The twin of
# velcro_cyclone_coll_em.toml. Box: y0 = 28.2 (Ly = 177.19; the Ly line below is not used), Lx = 176.25, jtwist = 5.
# Run:  gkx examples/gkx_ke/gkx_cyclone_coll_em.toml

[[species]]
name = "ion"
charge = 1.0
mass = 1.0
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.01
kinetic = true

[[species]]
name = "electron"
charge = -1.0
mass = 0.00027
density = 1.0
temperature = 1.0
tprim = 2.49
fprim = 0.8
nu = 0.6086
kinetic = true

[grid]
Nx = 64
Ny = 64
Nz = 24
Lx = 176.25000339052914
Ly = 62.8
boundary = "linked"
y0 = 28.2
ntheta = 24
nperiod = 1

[time]
damp_ends_rate = 0.1
t_max = 400.0
dt = 0.035
dt_max = 0.035
method = "imex-ars3"
collision_operator = "lenard_bernstein"
fixed_dt = true
sample_stride = 10
diagnostics_stride = 10
run_to = "t_max"
compressed_real_fft = true
laguerre_nonlinear_mode = "grid"

[geometry]
q = 1.4
s_hat = 0.8
epsilon = 0.18
R0 = 2.77778

[init]
init_field = "density"
init_amp = 1.0e-3
init_single = false
random_seed = 22
gaussian_init = false
kpar_init = 0.0

[physics]
linear = false
nonlinear = true
electrostatic = false
electromagnetic = true
use_apar = true
use_bpar = true
adiabatic_electrons = false
beta = 1.0e-3
collisions = true

[collisions]
D_hyper = 0.05
p_hyper_kperp = 2.0
hypercollisions_const = false
hypercollisions_kz = true
p_hyper = 2
p_hyper_m = 4
damp_ends_widthfrac = 0.125

[terms]
nonlinear = 1.0
hyperdiffusion = 1.0
hypercollisions = 1.0
end_damping = 1.0
apar = 1.0
bpar = 1.0

[normalization]
contract = "cyclone"
diagnostic_norm = "rho_star"

[output]
plots = false

[run]
ky = 0.3
Nl = 4
Nm = 16
